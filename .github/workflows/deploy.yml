name: Deploy to Cloudflare

# toolshed.lemon-agent.dev is two halves on one host: the Worker
# `lemon-toolshed-beacon` (wrangler.toml — the paid API and the machine
# surfaces) and the Cloudflare Pages project `lemon-toolshed` (the static
# site, built into dist/ by build.mjs). Every push to main builds, runs the
# test suite, and — provided the repository has the two Cloudflare secrets —
# deploys BOTH halves; the README's free-tier runbook says why one without the
# other is a drift:
#
#   CLOUDFLARE_API_TOKEN   an API token with Workers Scripts:Edit, Workers
#                          Routes:Edit, Cloudflare Pages:Edit and D1:Edit on
#                          the account (start from the "Edit Cloudflare
#                          Workers" template and add Pages + D1)
#   CLOUDFLARE_ACCOUNT_ID  the account id shown by `wrangler whoami`
#
# Until the token exists the deploy steps are skipped, not failed, and the
# site is deployed by hand:
#   npm run build && npx wrangler deploy \
#     && npx wrangler pages deploy dist --project-name lemon-toolshed --branch main
#
# build.mjs defaults SITE_HOST to the production host, so no env is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Deploy Worker (lemon-toolshed-beacon)
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Same version as the repo's devDependency and the local deploys.
          wranglerVersion: "4.42.2"
          command: deploy

      - name: Deploy Pages site (lemon-toolshed)
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.42.2"
          command: pages deploy dist --project-name=lemon-toolshed --branch=main
