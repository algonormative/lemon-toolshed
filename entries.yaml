      install: "pip install pandas lxml"
    url: "https://pandas.pydata.org/docs/reference/api/pandas.read_html.html"
    caveats: >-
      `colspan` and `rowspan` are NOT expanded — a merged-cell layout table comes back
      misaligned, and this is a data-table reader, not a layout reader. Values stay strings
      with whitespace collapsed; no type guessing, for the same reason csv-json refuses it.
      Nested tables are returned as their own entries rather than inlined. A page with no
      table at all is an error.
    escalate: >-
      When the table is not marked up as a table — a grid built from divs, or a merged-cell
      report where a human has to say what the rows mean.
    verified: 2026-08-30
    hosted:
      path: "/convert/html-json"
      price:
        amount_usd: 0.01
        scheme: exact
      status: live
