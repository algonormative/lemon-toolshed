# DRAFT for owner review — curation is an owner-taste surface; entries are proposals.
#
# Editorial stance: prefer the deterministic tool wherever it suffices; reach for a
# model only when the target is judgment-defined. `kind: model` means the tool is a
# model (local or hosted), not that the job is unsolvable deterministically — the
# `escalate` line is where model use is honestly located. All verdicts are
# engineering judgment, not measurement.
#
# Two optional blocks decide what an entry is:
#
#   hosted:              # present = we run this conversion on our server
#     path: "/convert/<id>"   # must equal /convert/ + the entry id
#     price: {amount_usd: 0.005, scheme: exact}   # or `free`
#     status: live            # or planned
#
# Every hosted tool is priced, and the price below is what every call costs:
# there is no free tier as of 2026-08-19 (see FREE_TIER_DAILY in build.mjs for
# why, and for how to put one back). The tier, when one exists, is a single
# build constant rather than a per-entry field — one number, published
# everywhere. OWNER-TUNABLE: the price here and FREE_TIER_DAILY in build.mjs.
#
#   local:               # how to run it on your own machine
#     tool: pandoc            # optional; defaults to the top-level `tool`
#     install: "brew install pandoc"
#
# An entry with no `hosted:` block is a local-only reference entry. The top-level
# `install:` field still works and is read as `local.install`, so the entries that
# predate this split need no edit.
#
# PRICES ARE PER TOOL, and as of 2026-08-30 they are no longer uniform. Two
# bands, and the split is about what a call actually costs us to run:
#
#   $0.005  a parse-and-re-emit between two structured text formats. One parser,
#           one serializer, both linear in the input.
#   $0.01   anything that has to build a DOM or a full document tree first —
#           the HTML tools and the XML reader. More CPU per byte, and a larger
#           blast radius of input weirdness to have got right.
#
# NOTHING outside entries.yaml hard-codes a figure any more: build.mjs derives
# the site's pricing sentence (a single price when they agree, a range when they
# do not) from the numbers here, and the Worker reads each price out of the
# compiled catalog. Change a number here, rebuild, and every surface follows.

entries:
  - id: markdown-to-pdf
    x: "Markdown (with math, code blocks, citations)"
    y: "PDF"
    tool: pandoc
    kind: deterministic
    verdict: >-
      Pandoc plus a Typst or LaTeX engine gives the same PDF on every run, with real
      pagination, footnotes and cross-references. The naive alternative — print-to-PDF
      from a Markdown previewer — loses footnote links and repaginates differently on
      every machine, which shows up as a diff you can't reproduce.
    install: "brew install pandoc typst"
    url: "https://pandoc.org"
    caveats: >-
      PDF output needs an external engine; Typst is fast and light, LaTeX (texlive) is
      heavy but still the only option for some journal templates.
    escalate: >-
      Never for the conversion. A model is only useful upstream — writing or
      restructuring the Markdown before pandoc touches it.
    verified: 2026-08-18

  - id: markdown-to-docx
    x: "Markdown"
    y: "DOCX styled to a house template"
    tool: pandoc
    kind: deterministic
    verdict: >-
      `--reference-doc=template.docx` maps headings, tables and code blocks onto a real
      Word style sheet, so a human reviewer gets an editable document instead of a wall
      of Normal-styled text. Pasting rendered Markdown into Word is the failure mode:
      styles arrive as direct formatting and the first edit shatters them.
    install: "brew install pandoc"
    url: "https://pandoc.org"
    caveats: >-
      Word-native features (comments, tracked changes, floats with anchors) don't
      round-trip; you get clean structure, not pixel-matched design.
    escalate: >-
      Never — style mapping is a template problem, not a judgment problem. Rewriting
      content for a different audience is a separate upstream step.
    verified: 2026-08-18

  - id: docx-to-markdown
    x: "DOCX"
    y: "Markdown + extracted media"
    tool: pandoc
    kind: deterministic
    verdict: >-
      Pandoc reads the DOCX XML directly, so headings, lists, tables and footnotes land
      as real Markdown structure, and `--extract-media` writes embedded images to disk
      instead of dropping them. Pasting a DOCX into a model to "convert it" is the
      failure mode: you pay tokens for a plausible-looking file with quietly renumbered
      lists and vanished tables.
    install: "brew install pandoc"
    url: "https://pandoc.org"
    caveats: >-
      Tracked changes and comments are discarded unless you pass `--track-changes=all`;
      pseudo-headings faked with bold text stay paragraphs, because they were never
      structure.
    escalate: >-
      Only when there is no structure to recover — a document where every heading was
      faked with formatting and you want semantic headings inferred.
    verified: 2026-08-18

  - id: html-markdown
    x: "Saved HTML page / static HTML file"
    y: "Markdown"
    tool: pandoc
    kind: deterministic
    verdict: >-
      For HTML already on disk, pandoc's reader is exact and fast, and `--wrap=none`
      keeps the output diff-friendly. Feeding a whole page to a model to "clean it up"
      burns tokens and invents heading levels; pandoc preserves precisely the structure
      that is there. The hosted endpoint runs Turndown instead of pandoc — same job, no
      install — as a priced x402 call, like every other hosted tool here.
    local:
      tool: pandoc
      install: "brew install pandoc"
    url: "https://pandoc.org"
    caveats: >-
      Pandoc converts everything, including nav, ads and cookie banners — pre-strip with
      a readability-style extractor (trafilatura, readability-lxml) if you only want the
      article body. The hosted endpoint has the same blind spot.
    escalate: >-
      Never for the markup. Boilerplate removal is a heuristic problem first; a model is
      a last resort for pages where the article body is genuinely ambiguous.
    verified: 2026-08-18
    hosted:
      path: "/convert/html-markdown"
      price:
        amount_usd: 0.01
        scheme: exact
      status: live

  - id: md-html
    x: "Markdown"
    y: "HTML"
    tool: pandoc
    kind: deterministic
    verdict: >-
      Markdown to HTML is a solved parse, so the only real questions are which dialect
      and which extensions. Pandoc is the local answer and handles tables, footnotes and
      math; the hosted endpoint runs `marked` over CommonMark plus GitHub tables, which
      is what most agents actually want when they say "render this Markdown".
    local:
      tool: pandoc
      install: "brew install pandoc"
    url: "https://pandoc.org"
    caveats: >-
      The hosted endpoint emits an HTML fragment, not a full document — no `<html>`,
      no stylesheet. It does not sanitize: raw HTML in the input passes through, so do
      not render untrusted output into a page without sanitizing it yourself.
    escalate: "Never."
    verified: 2026-08-18
    hosted:
      path: "/convert/md-html"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: rendered-dom-to-markdown
    x: "Live DOM in a browser or headless page (JS-rendered)"
    y: "Markdown"
    tool: turndown
    kind: deterministic
    verdict: >-
      When the content only exists after JavaScript runs, the conversion belongs where
      the DOM is — Turndown runs in-page or in Node against a parsed DOM and takes
      custom rules for app-specific markup. Fetching the raw HTML and running a static
      converter gets you an empty shell.
    install: "npm install turndown"
    url: "https://github.com/mixmark-io/turndown"
    caveats: >-
      Smaller rule set than pandoc; tables need the GFM plugin and you own the escaping
      edge cases.
    escalate: >-
      Never for markup. Use a model only to decide which region of a hostile app UI is
      "the content" — then hand that node to turndown.
    verified: 2026-08-18

  - id: markdown-to-epub
    x: "Markdown (multi-chapter manuscript)"
    y: "EPUB 3"
    tool: pandoc
    kind: deterministic
    verdict: >-
      `pandoc -o book.epub` produces a valid EPUB with a real table of contents,
      metadata and chapter splitting via `--split-level`; readers care about that
      structure far more than typography. The naive path — export to PDF and sideload —
      gives a fixed-layout file that is unreadable on a six-inch screen.
    install: "brew install pandoc"
    url: "https://pandoc.org"
    caveats: >-
      Run epubcheck before publishing; store-specific requirements (Apple, Kobo) go
      beyond mere validity.
    escalate: "Never."
    verified: 2026-08-18

  - id: video-to-portable-mp4
    x: "Arbitrary video (any container/codec)"
    y: "H.264 MP4 that plays everywhere"
    tool: ffmpeg
    kind: deterministic
    verdict: >-
      `-c:v libx264 -crf 20 -preset slow -c:a aac -movflags +faststart` is the boring
      correct answer for delivery: CRF targets quality rather than a guessed bitrate,
      and faststart lets playback begin before the file finishes downloading. GUI
      "convert to MP4" presets routinely omit faststart, so web playback stalls until
      the whole file lands.
    install: "brew install ffmpeg"
    url: "https://ffmpeg.org"
    caveats: >-
      CRF values are codec-relative — don't reuse an x264 number for x265 or AV1.
      Hardware encoders are much faster and meaningfully worse per bit.
    escalate: >-
      Never. Encoding is math; the only judgment is your quality/size target, which is a
      knob you set once.
    verified: 2026-08-18

  - id: video-to-audio-track
    x: "Video file with an audio track"
    y: "Audio file (m4a/wav)"
    tool: ffmpeg
    kind: deterministic
    verdict: >-
      `ffmpeg -i in.mp4 -vn -c:a copy out.m4a` lifts the existing audio stream with no
      re-encode and no generation loss; switch to `-c:a pcm_s16le out.wav` only when the
      next tool demands PCM. Reflexively re-encoding to MP3 adds a lossy generation for
      nothing.
    install: "brew install ffmpeg"
    url: "https://ffmpeg.org"
    caveats: >-
      Stream copy needs a container that accepts the codec (AAC to .m4a, not .wav);
      multi-track sources need an explicit `-map`.
    escalate: "Never."
    verified: 2026-08-18

  - id: audio-transcode-and-normalize
    x: "WAV / FLAC / arbitrary audio"
    y: "MP3 or Opus at a fixed sample rate and loudness"
    tool: ffmpeg
    kind: deterministic
    verdict: >-
      ffmpeg does the format change, the resample (`-ar`) and loudness normalization
      (`loudnorm`) in a single pass, which matters because chaining separate tools
      resamples twice and compounds artifacts. For speech and web delivery Opus at a low
      bitrate is clearly better than MP3 at the same size.
    install: "brew install ffmpeg"
    url: "https://ffmpeg.org"
    caveats: >-
      Single-pass loudnorm is approximate; use the two-pass measure-then-apply form when
      you actually care about hitting a LUFS target.
    escalate: "Never."
    verified: 2026-08-18

  - id: heic-to-jpeg
    x: "HEIC/HEIF photos from an iPhone"
    y: "JPEG"
    tool: imagemagick
    kind: deterministic
    verdict: >-
      `magick mogrify -format jpg -quality 88 *.heic` converts a folder in one line and
      keeps EXIF, which matters when the timestamps are the reason you kept the photos.
      Re-exporting through a photo app or a web converter tends to strip or rewrite
      metadata — and uploading personal photos to a random site is a privacy trade you
      probably didn't intend to make.
    install: "brew install imagemagick libheif"
    url: "https://imagemagick.org"
    caveats: >-
      Requires a libheif-enabled build (check `magick -list format | grep -i heic`);
      slower and hungrier than libvips on large batches.
    escalate: "Never."
    verified: 2026-08-18

  - id: bulk-image-resize
    x: "Large batch of source images"
    y: "Web-sized JPEG/WebP/AVIF derivatives"
    tool: libvips
    kind: deterministic
    verdict: >-
      `vipsthumbnail` streams through a batch on a small memory footprint and gets the
      defaults right — shrink-on-load for JPEG, sane colour handling. The naive
      `magick -resize` loop over thousands of files is where the out-of-memory kills and
      the hour-long builds come from.
    install: "brew install vips"
    url: "https://www.libvips.org"
    caveats: >-
      Fewer effects and filters than ImageMagick; heavy compositing or annotation work
      still belongs in ImageMagick, at its cost.
    escalate: >-
      Never for the resize. Picking crop focal points across a large library is the one
      adjacent task where a model (saliency detection) earns its keep.
    verified: 2026-08-18

  - id: svg-to-png
    x: "Static SVG"
    y: "PNG at a chosen scale"
    tool: resvg
    kind: deterministic
    verdict: >-
      resvg renders an SVG to PNG with no browser and no JS runtime, so it runs in CI and
      produces the same bytes run after run. Headless Chrome does the same job while
      pulling in a browser-sized dependency and a screenshot timing race.
    install: "cargo install resvg"
    url: "https://github.com/linebender/resvg"
    caveats: >-
      Static SVG only — no scripting, no remote resource fetching, and web fonts must be
      installed locally. `rsvg-convert` (librsvg) is the distro-packaged alternative.
    escalate: "Never."
    verified: 2026-08-18

  - id: json-yaml
    x: "JSON"
    y: "YAML"
    tool: yq
    kind: deterministic
    verdict: >-
      mikefarah's yq speaks both formats natively (`yq -P`) and preserves comments
      through YAML edits, which is the whole reason to use it on real config files. The
      hosted endpoint is the no-install version for the common case: valid JSON in,
      block-style YAML out.
    local:
      tool: yq
      install: "brew install yq"
    url: "https://github.com/mikefarah/yq"
    caveats: >-
      Two unrelated tools are named yq — the Go one (mikefarah) and a Python jq wrapper
      (kislyuk); the flags differ, so pin which one your scripts assume. The hosted
      endpoint has no comments to preserve, because JSON has none.
    escalate: "Never."
    verified: 2026-08-18
    hosted:
      path: "/convert/json-yaml"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: yaml-json
    x: "YAML"
    y: "JSON"
    tool: yq
    kind: deterministic
    verdict: >-
      `yq -o=json` is the local answer, and the direction that bites is this one: YAML
      is the larger language, so anchors, multi-document streams and unquoted `no`/`yes`
      all have to land somewhere in JSON. The hosted endpoint takes the first document
      of a stream and resolves anchors, which is what a config-reading agent wants.
    local:
      tool: yq
      install: "brew install yq"
    url: "https://github.com/mikefarah/yq"
    caveats: >-
      Multi-document YAML collapses to its first document on the hosted endpoint — use
      local yq if you need all of them. YAML dates and other non-JSON scalar types are
      stringified.
    escalate: "Never."
    verified: 2026-08-18
    hosted:
      path: "/convert/yaml-json"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: csv-json
    x: "CSV"
    y: "JSON"
    tool: csvkit
    kind: deterministic
    verdict: >-
      `csvjson data.csv` turns a header row plus records into an array of objects, which
      is the shape almost everything downstream wants. The hosted endpoint does the same
      thing with an RFC-4180 parser, so quoted commas and embedded newlines survive —
      which is exactly what a split-on-comma one-liner gets wrong.
    local:
      tool: csvkit
      install: "pip install csvkit"
    url: "https://csvkit.readthedocs.io"
    caveats: >-
      Every value comes out a string; the hosted endpoint does not guess types, because
      guessing is where leading zeros and long IDs get destroyed. Rows shorter than the
      header are padded with empty strings, and a row with more fields than the header
      is an error rather than a silent truncation.
    escalate: >-
      Never for the parse. Deciding what the columns *mean* — see messy-csv-to-clean-csv
      — is the judgment half.
    verified: 2026-08-18
    hosted:
      path: "/convert/csv-json"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: json-reshape
    x: "Nested JSON from an API"
    y: "Flat JSON / NDJSON / CSV rows"
    tool: jq
    kind: deterministic
    verdict: >-
      jq is a real language for this: `-r`, `@csv`, `to_entries`, `group_by` cover most
      reshapes in a line, and the result is an auditable program you can re-run on
      tomorrow's payload. Asking a model to "reshape this JSON" produces an answer, not
      a program — it doesn't survive the next record and quietly guesses on nulls.
    install: "brew install jq"
    url: "https://jqlang.github.io/jq/"
    caveats: >-
      Very large documents need `--stream` or NDJSON input; the syntax has a genuine
      learning curve that people repeatedly underestimate.
    escalate: >-
      Use a model to *write the jq program* when the shape is unfamiliar — then keep the
      program, drop the model, and put the program in version control.
    verified: 2026-08-18

  - id: messy-csv-to-clean-csv
    x: "Messy CSV (ragged rows, BOM, mixed quoting, duplicate headers)"
    y: "Clean, validated UTF-8 CSV"
    tool: qsv
    kind: deterministic
    verdict: >-
      `qsv input` normalizes quoting and line endings, and `validate`/`headers`/`dedup`
      tell you what is actually wrong before the data reaches anything downstream — all
      at streaming speed on files far past spreadsheet size. Opening it in Excel to "fix
      it" is the classic failure: leading zeros vanish, long IDs become floats, and dates
      get silently localized.
    install: "brew install qsv"
    url: "https://github.com/dathere/qsv"
    caveats: >-
      Some subcommands depend on how the binary was built (feature flags); csvkit is
      slower but pip-installable everywhere and reads more input formats.
    escalate: >-
      Only when the fix requires meaning — deciding that "N/A", "-" and "" are the same
      null, or that two differently-spelled columns are one field. Extract
      deterministically, let a model propose the mapping, then encode that mapping as a
      rule you can re-run.
    verified: 2026-08-18

  - id: xlsx-to-csv
    x: "XLSX workbook (specific sheet)"
    y: "CSV"
    tool: csvkit
    kind: deterministic
    verdict: >-
      `in2csv --sheet "Sheet2" book.xlsx` gets the sheet you asked for with stable typing
      and scripts across a directory. Save-As-CSV in Excel exports only the active sheet,
      applies the machine's locale to dates and separators, and cannot be automated —
      which is how two people produce two different CSVs from one workbook.
    install: "pip install csvkit"
    url: "https://csvkit.readthedocs.io"
    caveats: >-
      Formulas export as their last cached value; merged cells and multi-row headers
      still need reshaping. Very large workbooks are slow — `qsv excel` is the fast path.
    escalate: >-
      When the sheet is a human-formatted report rather than a table (title rows, merged
      headers, stacked sub-tables), identifying the header row is genuine judgment: dump
      deterministically first, then let a model name the header row and the sub-table
      boundaries.
    verified: 2026-08-18

  - id: csv-to-sqlite
    x: "Large CSV"
    y: "Queryable SQLite database"
    tool: sqlite3
    kind: deterministic
    verdict: >-
      `.import --csv data.csv t` buys you indexes, joins and SQL over a file too big for
      a spreadsheet, with no service and no ORM. Loading a multi-hundred-megabyte CSV
      into pandas just to filter it is the naive alternative — paying RAM for work the
      disk should be doing.
    install: "built-in (macOS/most Linux); brew install sqlite for a current version"
    url: "https://sqlite.org/cli.html"
    caveats: >-
      `.import` types every column as TEXT unless you create the table first — declare
      the schema when numeric comparison matters. csvkit's `csvsql --db` infers types at
      a large speed cost.
    escalate: "Never."
    verified: 2026-08-18

  - id: sqlite-to-json
    x: "SQLite query result"
    y: "JSON / NDJSON for an API or an agent"
    tool: sqlite3
    kind: deterministic
    verdict: >-
      `sqlite3 -json db.sqlite "select ..."` (or `.mode json`) emits valid JSON straight
      from the CLI, composes with jq in a pipe, and needs no serialization layer.
      Hand-rolling a Python export script for this creates code you now have to maintain
      and test.
    install: "built-in"
    url: "https://sqlite.org/cli.html"
    caveats: >-
      Needs a reasonably modern SQLite (3.33+) for the `-json` flag; check BLOB and NULL
      handling before shipping the output anywhere.
    escalate: "Never."
    verified: 2026-08-18

  - id: pdf-digital-born-to-text
    x: "PDF (digital-born — has a text layer)"
    y: "Plain text / layout-preserved text"
    tool: pdftotext
    kind: deterministic
    verdict: >-
      If `pdftotext -layout` returns real text, the job is already finished — the
      characters are in the file and extraction is exact and instant. This is the entry
      that governs the whole PDF branch of the directory: run pdftotext first on every
      PDF, and only when it comes back empty or garbled does the file deserve OCR or a
      model.
    install: "brew install poppler"
    url: "https://poppler.freedesktop.org"
    caveats: >-
      Multi-column and tabular layouts still interleave; `-layout` helps, and
      `-bbox-layout` gives coordinates when you need to reconstruct columns yourself.
    escalate: >-
      Never for extraction. Escalate only for interpretation — turning extracted text
      into a schema (see messy-doc-to-schema).
    verified: 2026-08-18

  - id: pdf-scanned-to-searchable
    x: "PDF (scanned — page images, no text layer)"
    y: "Searchable PDF + extractable text"
    tool: ocrmypdf
    kind: hybrid
    verdict: >-
      ocrmypdf adds an invisible text layer to the original pages, so the file stays a
      faithful scan and becomes greppable and citable; `--skip-text` and `--redo-ocr`
      make it safe to sweep a mixed directory. Pointing raw tesseract at the page images
      throws the PDF away and leaves you a text blob nobody can cite a page number from.
    install: "brew install ocrmypdf"
    url: "https://ocrmypdf.readthedocs.io"
    caveats: >-
      OCR quality is bounded by scan quality — deskew and clean help, but phone photos of
      curved pages stay bad. Slow and CPU-hungry on long documents.
    escalate: >-
      When accuracy matters on hard scans — handwriting, historical type, dense tables —
      a vision model reads them better. Still run OCR first and keep its output as a
      cross-check: OCR fails loudly, models fail by writing plausible words.
    verified: 2026-08-18

  - id: pdf-to-page-images
    x: "PDF page(s)"
    y: "PNG/JPEG page images"
    tool: pdftoppm
    kind: deterministic
    verdict: >-
      `pdftoppm -r 200 -png` renders pages reproducibly and is the correct pre-step
      whenever OCR or a vision model is the next stage, because you control DPI, page
      range and colour — which is exactly what downstream accuracy depends on.
      Screenshotting pages by hand introduces cropping and scaling nobody wrote down.
    install: "brew install poppler"
    url: "https://poppler.freedesktop.org"
    caveats: >-
      300+ dpi over a long document produces very large files quickly; pick the lowest
      DPI the downstream stage tolerates and record it.
    escalate: >-
      This pair is the deterministic half of a model workflow — the model comes after,
      on the rendered images, never instead of the render.
    verified: 2026-08-18

  - id: pdf-tables-to-csv
    x: "PDF with ruled or whitespace-aligned tables"
    y: "CSV / DataFrame"
    tool: camelot
    kind: deterministic
    verdict: >-
      Camelot's lattice mode reconstructs cells from the table's actual ruling lines, so
      on a bordered table it is exact rather than approximate; stream mode handles
      whitespace-aligned tables with more supervision. Copy-pasting a table out of a PDF
      viewer merges columns unpredictably and you won't notice until a number is wrong in
      a report.
    install: 'pip install "camelot-py[base]"'
    url: "https://github.com/camelot-dev/camelot"
    caveats: >-
      Digital-born PDFs only; borderless tables need tuning, and the parse-accuracy
      report is worth reading rather than trusting. tabula-java and pdfplumber are
      reasonable alternatives with different failure shapes.
    escalate: >-
      Scanned tables, or tables whose header semantics are ambiguous, are legitimately
      model work — render pages with pdftoppm, give the model the image, then validate
      totals and row counts deterministically.
    verified: 2026-08-18

  - id: office-docs-to-pdf-batch
    x: "DOCX/XLSX/PPTX (batch)"
    y: "PDF"
    tool: libreoffice
    kind: deterministic
    verdict: >-
      `soffice --headless --convert-to pdf --outdir out/ *.docx` is the only free path
      that renders Office layout faithfully enough to hand to someone, and it batches on
      a server with no Office licence. Pandoc converts the content but is not a layout
      engine — it will not preserve a deck's slides or a spreadsheet's pagination.
    install: "brew install --cask libreoffice"
    url: "https://www.libreoffice.org"
    caveats: >-
      Fidelity is high, not perfect: fonts must be installed on the host, and exotic
      SmartArt or macro-driven content drifts. Concurrent runs need separate profiles via
      `-env:UserInstallation=`.
    escalate: "Never."
    verified: 2026-08-18

  - id: html-to-paginated-pdf
    x: "HTML + CSS (invoice, report, generated page)"
    y: "Paginated PDF"
    tool: weasyprint
    kind: deterministic
    verdict: >-
      WeasyPrint implements print CSS — `@page`, running headers, page counters — so a
      report template paginates the same way in CI as on your laptop, with no browser in
      the image. Headless Chrome does the same job but its output shifts with the Chrome
      version, which is a bad property for anything invoice-shaped.
    install: "pip install weasyprint"
    url: "https://weasyprint.org"
    caveats: >-
      No JavaScript execution — render dynamic content to static HTML first. Very modern
      CSS layout features can differ from a browser's rendering.
    escalate: "Never."
    verified: 2026-08-18

  - id: image-to-text
    x: "Image of text (screenshot, clean scan, photo)"
    y: "Plain text"
    tool: tesseract
    kind: model
    verdict: >-
      Tesseract is a fixed local model — same input, same output, no API, nothing leaving
      the machine — and `--psm` is the knob that actually matters (6 for a block, 7 for a
      single line). Sending screenshots to a hosted vision API for text you could extract
      locally is a cost and privacy leak on the easy majority of cases.
    install: "brew install tesseract tesseract-lang"
    url: "https://github.com/tesseract-ocr/tesseract"
    caveats: >-
      Wants clean, high-contrast, deskewed input; handwriting, stylized type and text
      over busy imagery are outside its range. When it fails it produces visible garbage,
      which is a useful property.
    escalate: >-
      Handwriting, dense multi-column layouts, or text embedded in imagery — a vision
      model reads those. Also whenever the target is semantic ("what is the total on this
      receipt") rather than the characters themselves.
    verified: 2026-08-18

  - id: speech-audio-to-transcript
    x: "Recorded speech (meeting, interview, podcast)"
    y: "Transcript (text/SRT/VTT)"
    tool: whisper.cpp
    kind: model
    verdict: >-
      This pair has no deterministic answer; speech-to-text is model work and pretending
      otherwise wastes a day. whisper.cpp runs the weights locally at usable speed on
      Apple Silicon and writes SRT/VTT directly, so recordings never leave the machine
      and the marginal cost per hour of audio is zero.
    install: "brew install whisper-cpp"
    url: "https://github.com/ggml-org/whisper.cpp"
    caveats: >-
      No speaker diarization out of the box; accuracy drops with accents, crosstalk and
      domain jargon, and it can emit invented text over long silences. Bigger models are
      considerably better and considerably slower. faster-whisper is the Python/GPU
      alternative.
    escalate: >-
      Already model-tier. Go further only for diarization, or for a cleanup pass on
      punctuation and domain terminology — and always keep the raw transcript alongside
      the cleaned one.
    verified: 2026-08-18

  - id: messy-doc-to-schema
    x: "Messy document (invoice, contract, report PDF/DOCX)"
    y: "Structured records against a schema"
    tool: unstructured
    kind: hybrid
    verdict: >-
      Split the job rather than the tool: deterministic partitioning (unstructured's
      parsers, or pdftotext/pdfplumber) yields elements, positions and tables, and a
      model is asked only for the fields that are genuinely judgment — which of these
      three numbers is "the total", is this clause an indemnity. Handing the whole PDF to
      an LLM and asking for JSON is the expensive failure mode: it works on the demo
      document and fabricates on the tenth, with no signal that it did.
    install: 'pip install "unstructured[all-docs]"'
    url: "https://github.com/Unstructured-IO/unstructured"
    caveats: >-
      Heavy dependency tree (OCR, ONNX models) and quality varies a lot by document type;
      validate the extracted structure before trusting anything built on top of it.
    escalate: >-
      The model tier is the point here — keep it narrow. Constrain output to the schema,
      validate every extracted number against the deterministic parse, and log both so a
      disagreement is visible.
    verified: 2026-08-18

  - id: legacy-ebook-to-epub
    x: "MOBI/AZW3/LIT and other legacy ebook formats"
    y: "EPUB"
    tool: calibre
    kind: deterministic
    verdict: >-
      `ebook-convert in.azw3 out.epub` carries the TOC, metadata and internal links
      across a dozen legacy formats — a decade of accumulated format edge cases you
      should not re-derive. Pandoc does not read these formats, and "free online ebook
      converter" sites mean uploading your library to a stranger.
    install: "brew install --cask calibre"
    url: "https://calibre-ebook.com"
    caveats: >-
      DRM-protected files will not convert, and whether to remove DRM is your legal call,
      not the tool's. Heavily designed fixed-layout books reflow poorly.
    escalate: "Never."
    verified: 2026-08-18

  - id: media-to-metadata-json
    x: "Photo / video / PDF file"
    y: "Structured metadata (JSON)"
    tool: exiftool
    kind: deterministic
    verdict: >-
      `exiftool -json -r dir/` reads (and writes) metadata across essentially every
      format and tag standard, which makes it the right first move before any lossy
      pipeline: capture the metadata, then convert. The naive path drops timestamps and
      GPS during the convert step and you find out months later, with no way back.
    install: "brew install exiftool"
    url: "https://exiftool.org"
    caveats: >-
      Writing tags rewrites files — keep the `_original` backups, or pass
      `-overwrite_original` deliberately. Tag namespaces are numerous and vendor-specific.
    escalate: >-
      Never for reading. A model is only relevant for deriving metadata that isn't there
      — captions, subjects, scene descriptions — which is a different job with different
      accuracy expectations.
    verified: 2026-08-18

  - id: legacy-encoding-to-utf8
    x: "Text/CSV in a legacy encoding (CP-1252, Latin-1, Shift-JIS) showing mojibake"
    y: "Clean UTF-8"
    tool: iconv
    kind: deterministic
    verdict: >-
      `iconv -f WINDOWS-1252 -t UTF-8` fixes the entire class of "why are there Â
      characters" bugs in one pass once you know the source encoding; pair it with
      `uchardet` or `file -I` to guess. Find-and-replacing the visible mojibake by hand is
      the failure mode — you fix the common characters and leave the rare ones to break a
      parser downstream.
    install: "built-in (GNU/BSD iconv); brew install uchardet for detection"
    url: "https://www.gnu.org/software/libiconv/"
    caveats: >-
      Encoding detection is a guess, not a fact — verify on a sample containing known-odd
      characters. `//TRANSLIT` silently degrades anything unmappable.
    escalate: >-
      Never for the conversion; a model is at most a tie-breaker when detection is
      ambiguous and you have a sample of known-correct text to compare against.
    verified: 2026-08-18

  # ---------------------------------------------------------------- 2026-08-30
  # The second hosted wave. Same editorial rule as the first: we host the ones
  # where a single parser and a single serializer settle the question, and we
  # say plainly where that stops being true.

  - id: json-csv
    x: "JSON array of records"
    y: "CSV with a header row"
    tool: csvkit
    kind: deterministic
    verdict: >-
      `in2csv --format json` is the local answer, and the hosted endpoint is the inverse of
      our own csv-json: an array of objects in, a header row plus one line per record out,
      RFC-4180 quoted so commas, quotes and newlines inside values survive. The column set
      is the union of every record's keys in first-seen order, so a record missing a key
      gets an empty cell rather than a shifted row — which is what hand-rolled
      `Object.values().join(',')` gets wrong the first time a record differs.
    local:
      tool: csvkit
      install: "pip install csvkit"
    url: "https://csvkit.readthedocs.io"
    caveats: >-
      CSV is flat and JSON is not. One level of nesting is flattened to dotted columns
      (`user.id`), and anything deeper — or any array — is written back as compact JSON in
      the cell rather than being invented into columns. A top-level value that is not an
      array of objects is an error, not a one-row guess.
    escalate: >-
      Never for the serialization. A model is only worth reaching for upstream, when the
      question is which fields a human-facing spreadsheet should even have.
    verified: 2026-08-30
    hosted:
      path: "/convert/json-csv"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: csv-yaml
    x: "CSV"
    y: "YAML"
    tool: yq
    kind: deterministic
    verdict: >-
      `yq -p=csv -o=yaml` does this locally; the hosted endpoint runs the same RFC-4180
      parser csv-json uses and dumps block-style YAML, which is the shape you want when a
      spreadsheet export has to become a config file or a fixture. The reason to bother
      rather than eyeballing it: quoted commas and embedded newlines become correctly
      quoted YAML scalars instead of a document that parses to the wrong thing silently.
    local:
      tool: yq
      install: "brew install yq"
    url: "https://github.com/mikefarah/yq"
    caveats: >-
      Every value stays a string, deliberately — the same no-type-guessing rule csv-json
      states, so `007` and long ids survive. If you want numbers, cast them downstream
      where you know the schema. Header cells are trimmed; values are not.
    escalate: >-
      Never. Naming and typing the columns is the judgment half, and it belongs upstream of
      this call.
    verified: 2026-08-30
    hosted:
      path: "/convert/csv-yaml"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: yaml-csv
    x: "YAML list of records"
    y: "CSV with a header row"
    tool: yq
    kind: deterministic
    verdict: >-
      `yq -o=csv` locally. The hosted endpoint takes the first document of a stream,
      resolves anchors, and requires the result to be a list of maps — because that is the
      only YAML shape that is a table. Anything else is refused rather than flattened into
      a plausible-looking sheet, which is the failure this endpoint exists to avoid.
    local:
      tool: yq
      install: "brew install yq"
    url: "https://github.com/mikefarah/yq"
    caveats: >-
      Multi-document input collapses to its first document. Nested maps flatten one level
      to dotted columns and deeper structures are written as compact JSON in the cell;
      YAML dates and other non-JSON scalars are stringified.
    escalate: >-
      Never for the conversion. Deciding which nested fields deserve to be columns is a
      schema decision, not a parse.
    verified: 2026-08-30
    hosted:
      path: "/convert/yaml-csv"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: json-ndjson
    x: "JSON array"
    y: "NDJSON (newline-delimited JSON)"
    tool: jq
    kind: deterministic
    verdict: >-
      `jq -c '.[]'` is the local one-liner and it is the right one. The hosted endpoint is
      the no-install version: one compact JSON value per line, which is the format every
      streaming consumer — BigQuery loads, log shippers, `jq --stream` pipelines — actually
      wants. Doing it with string surgery on the array's commas is the failure mode:
      commas inside strings and nested arrays are not delimiters.
    local:
      tool: jq
      install: "brew install jq"
    url: "https://jqlang.github.io/jq/"
    caveats: >-
      The input must be a JSON array; a bare object or scalar is an error rather than a
      one-line file, because guessing there is how a caller ends up with a stream of one.
      Elements are re-serialized compactly, so key order is preserved but formatting is not.
    escalate: "Never."
    verified: 2026-08-30
    hosted:
      path: "/convert/json-ndjson"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: ndjson-json
    x: "NDJSON (newline-delimited JSON)"
    y: "JSON array"
    tool: jq
    kind: deterministic
    verdict: >-
      `jq -s '.'` slurps a stream back into an array locally. The hosted endpoint does the
      same and, when a line does not parse, says which line — which is the whole value of
      running a real parser over a log file instead of wrapping it in brackets and hoping.
      Blank lines are skipped; everything else must be a complete JSON value.
    local:
      tool: jq
      install: "brew install jq"
    url: "https://jqlang.github.io/jq/"
    caveats: >-
      The whole stream is materialised in memory, so the 256 KB body cap is the real limit
      here — for anything larger use local `jq -s` rather than splitting the file, since a
      split changes what the array means. A trailing partial line is an error, not a
      truncation.
    escalate: "Never."
    verified: 2026-08-30
    hosted:
      path: "/convert/ndjson-json"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: frontmatter-json
    # NOT "Markdown with YAML frontmatter". /check matches `from` as a substring of
    # this field, and that phrasing made `?from=yaml` offer an endpoint that cannot
    # take a YAML file — the same mis-routing the rendered-dom entry's alias note
    # describes. The fence is what the tool reads; the file is Markdown.
    x: "Markdown with a frontmatter fence"
    y: "JSON with the metadata and the body split apart"
    tool: python-frontmatter
    kind: deterministic
    verdict: >-
      Splitting on the `---` fence is three lines of code that everyone writes slightly
      wrong: the fence has to be the first thing in the file, the closing fence has to be
      on its own line, and a `---` inside the body is a horizontal rule rather than a
      delimiter. The hosted endpoint returns `{"data": ..., "content": ...}` — parsed
      frontmatter and the untouched body — which is what a static-site pipeline or a
      content audit actually needs.
    local:
      tool: python-frontmatter
      install: "pip install python-frontmatter"
    url: "https://python-frontmatter.readthedocs.io"
    caveats: >-
      YAML frontmatter only — TOML (`+++`) and JSON frontmatter are not recognised. A file
      with no opening fence is an error rather than an empty `data` object, because
      silently reporting "no metadata" for a file whose fence you mistyped is the bug this
      would otherwise hide. The body is returned byte-for-byte, unrendered.
    escalate: >-
      Never for the split. A model is the right tool only for the different job of
      inferring metadata a document never carried.
    verified: 2026-08-30
    hosted:
      path: "/convert/frontmatter-json"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: markdown-json
    x: "Markdown"
    y: "JSON token tree plus a table of contents"
    tool: pandoc
    kind: deterministic
    verdict: >-
      `pandoc -t json` gives you pandoc's AST locally. The hosted endpoint returns
      `marked`'s token stream plus a derived `toc` array of `{depth, text}` — the cheap
      thing an agent usually wants, which is the document's shape without having to render
      it and re-parse the HTML. Asking a model to "extract the headings" costs tokens for
      an answer that quietly renumbers on the next input; a lexer does not.
    local:
      tool: pandoc
      install: "brew install pandoc"
    url: "https://pandoc.org"
    caveats: >-
      The token shape is `marked`'s, not pandoc's and not a standard — it is stable across
      a call but it is a library's data structure, so pin behaviour you depend on with your
      own test. `toc` is built from ATX and setext headings only; a bold line pretending to
      be a heading was never structure and does not appear.
    escalate: >-
      Only when the headings you want do not exist as headings and someone has to decide
      what the document's sections really are.
    verified: 2026-08-30
    hosted:
      path: "/convert/markdown-json"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: srt-vtt
    x: "SubRip subtitle file (.srt)"
    y: "WebVTT (.vtt)"
    tool: ffmpeg
    kind: deterministic
    verdict: >-
      `ffmpeg -i in.srt out.vtt` converts locally. The difference between the two formats
      is small and entirely mechanical — a `WEBVTT` header line and a decimal point where
      SubRip writes a comma — which is exactly why it is worth doing with a parser rather
      than a global find-and-replace: a comma inside the caption text is not a timestamp
      separator, and replacing it corrupts the dialogue instead of the timing.
    local:
      tool: ffmpeg
      install: "brew install ffmpeg"
    url: "https://ffmpeg.org"
    caveats: >-
      Cue numbers are kept as WebVTT cue identifiers, which is legal and which some players
      display; strip them first if that matters. SubRip's `{\an8}` and `<font>` positioning
      tags are passed through untouched rather than translated to VTT cue settings.
    escalate: "Never — this is a format rewrite, not a judgment."
    verified: 2026-08-30
    hosted:
      path: "/convert/srt-vtt"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: vtt-srt
    x: "WebVTT (.vtt)"
    y: "SubRip subtitle file (.srt)"
    tool: ffmpeg
    kind: deterministic
    verdict: >-
      The harder direction, and the reason to use a parser: WebVTT is the larger format, so
      the `WEBVTT` header, `NOTE`/`STYLE`/`REGION` blocks, cue settings after the timestamp
      and hour-less `mm:ss.mmm` stamps all have to land somewhere in SubRip, which has none
      of them. The hosted endpoint drops what SubRip cannot express, expands short
      timestamps to `hh:mm:ss,mmm` and renumbers cues from 1, which is what players expect.
    local:
      tool: ffmpeg
      install: "brew install ffmpeg"
    url: "https://ffmpeg.org"
    caveats: >-
      Cue settings (`align`, `line`, `position`) and styling blocks are DISCARDED — SubRip
      has nowhere to put them, and dropping them loudly here beats a player ignoring them
      later. Cue identifiers are replaced by sequential numbers. Input that does not begin
      with `WEBVTT` is refused rather than parsed hopefully.
    escalate: "Never."
    verified: 2026-08-30
    hosted:
      path: "/convert/vtt-srt"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: toml-json
    x: "TOML config file"
    y: "JSON"
    tool: dasel
    kind: deterministic
    verdict: >-
      `dasel -r toml -w json` locally. TOML's whole point is that it has a spec and one
      reading, so a conforming parser gives you the same document every time — including
      the parts hand-rolled readers get wrong, like dotted keys, arrays of tables and
      offset date-times. Regexing a `pyproject.toml` or a `Cargo.toml` for a version string
      works until a value moves into a table header.
    local:
      tool: dasel
      install: "brew install dasel"
    url: "https://daseldocs.tomwright.me"
    caveats: >-
      Comments are dropped, because JSON has none — this is a read path, not a round trip.
      TOML dates and date-times become ISO-8601 strings, since JSON has no date type, and
      integers outside JavaScript's safe range lose precision.
    escalate: "Never."
    verified: 2026-08-30
    hosted:
      path: "/convert/toml-json"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: json-toml
    x: "JSON object"
    y: "TOML"
    tool: dasel
    kind: deterministic
    verdict: >-
      `dasel -r json -w toml` is the local answer. The direction that bites is this one:
      TOML's root must be a table, so a JSON array or scalar has nowhere to go, and `null`
      has no TOML spelling at all. The hosted endpoint refuses both rather than emitting a
      file that parses to something you did not write.
    local:
      tool: dasel
      install: "brew install dasel"
    url: "https://daseldocs.tomwright.me"
    caveats: >-
      A non-object root, or a `null` anywhere in the document, is an error — TOML cannot
      express either, and there is no honest substitute. Key order follows the JSON
      document; the emitted file is valid TOML but it is not formatted the way a human
      would have laid it out.
    escalate: >-
      Never for the encoding. Whether a generated config should be checked in at all is a
      different conversation.
    verified: 2026-08-30
    hosted:
      path: "/convert/json-toml"
      price:
        amount_usd: 0.005
        scheme: exact
      status: live

  - id: xml-json
    x: "XML document (feed, export, SOAP payload)"
    y: "JSON"
    tool: yq
    kind: deterministic
    verdict: >-
      `yq -p=xml -o=json` locally. XML-to-JSON is not a bijection and every tool picks a
      convention; ours is `fast-xml-parser`'s — attributes prefixed `@_`, text content
      under `#text`, repeated sibling elements collapsed into an array. Stating the
      convention is the product: a model asked to "turn this XML into JSON" invents a
      different one per call, which is unusable in a pipeline.
    local:
      tool: yq
      install: "brew install yq"
    url: "https://github.com/mikefarah/yq"
    caveats: >-
      A document with a `<!DOCTYPE>` is REFUSED, not parsed — internal DTD entities are how
      an entity-expansion bomb fits inside a 256 KB body, and no output is worth that.
      Namespace prefixes are kept verbatim as part of the key, and an element that appears
      once is an object while the same element appearing twice is an array, so consumers
      must handle both. Values stay strings: the parser's number coercion is switched off,
      because it turns an id of `007` into `7`.
    escalate: >-
      Never for the parse. Mapping someone's XML schema onto the JSON shape your system
      wants is a separate, genuinely judgment-shaped job.
    verified: 2026-08-30
    hosted:
      path: "/convert/xml-json"
      price:
        amount_usd: 0.01
        scheme: exact
      status: live

  - id: html-text
    x: "Saved HTML page / static HTML file"
    y: "Plain text, readable"
    tool: lynx
    kind: deterministic
    verdict: >-
      `lynx -dump -nolist` is the classic local answer. The hosted endpoint parses the page
      with a real DOM and walks it, so block elements become paragraph breaks and
      `<script>`, `<style>`, `<nav>`, `<header>`, `<footer>` and `<aside>` are dropped with
      their contents — which is the difference between readable prose and an analytics
      snippet wedged between two sentences. Stripping tags with a regex is the failure mode
      and it has been for thirty years.
    local:
      tool: lynx
      install: "brew install lynx"
    url: "https://lynx.invisible-island.net"
    caveats: >-
      Dropping the chrome elements is a heuristic, not readability extraction: a page that
      puts its article inside `<aside>` loses it, and a page with no semantic elements keeps
      its navigation. Links become their text, not their URL. `<pre>` content is preserved
      verbatim; everything else has its whitespace collapsed.
    escalate: >-
      Only where the article body is genuinely ambiguous. Try a readability extractor
      (trafilatura, readability-lxml) before a model — it is cheaper and reproducible.
    verified: 2026-08-30
    hosted:
      path: "/convert/html-text"
      price:
        amount_usd: 0.01
        scheme: exact
      status: live

  - id: html-json
    x: "HTML page containing data tables"
    y: "JSON rows keyed by the header row"
    tool: pandas
    kind: deterministic
    verdict: >-
      `pandas.read_html` locally. The hosted endpoint parses the page with a real DOM and
      returns every `<table>` as `{caption, columns, rows}` with each row an object keyed
      by the header cells — a stable shape whether the page has one table or nine. Handing
      a table to a model to "read the numbers out" is the expensive way to get a
      transcription error you cannot see.
    local:
