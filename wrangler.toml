name = "lemon-toolshed-beacon"
main = "worker/beacon.js"
compatibility_date = "2026-08-01"

# The Worker imports marked, js-yaml, turndown and @mixmark-io/domino. Wrangler
# bundles npm dependencies natively, so there is no build step to configure —
# but `npm ci` must have run before `wrangler deploy`.
#
# It also imports worker/catalog.generated.js, which `npm run build` writes from
# entries.yaml. Run the build and commit that file before deploying; wrangler
# reads it from disk.

# The read surface is NOT here. It is a separate Cloudflare Pages project
# serving dist/ as static assets with ZERO Functions — adding a Function
# re-opens the pages.dev twin's metered path (dossier § Limits, "The twin").

# The routes. The page addresses the beacon by RELATIVE URL, so a page served
# from the pages.dev twin resolves /b against the twin, where no Worker route and
# no Function exist, and the request lands on static handling. Traffic reaches
# this Worker only through the zone, where the rung-0 rate-limiting rule lives.
#
# WHY `/check*` AND NOT `/check` — verified against the Workers routing docs
# 2026-08-18, and it is the opposite of the intuitive reading:
#
#   "Route pattern matching considers the entire request URL, including the query
#    parameter string. Since route patterns may not contain query parameters, the
#    only way to have a route pattern match URLs with query parameters is to
#    terminate it with a wildcard, *."
#
# So the query string is NOT ignored. A bare `toolshed.lemon-agent.dev/check`
# would match `/check` and MISS `/check?from=markdown&to=html` — which is every
# real call. And a `/check?*` pattern is not a fix, it is invalid: patterns may
# not contain query parameters at all. The trailing wildcard is the only form
# that catches both. `/convert/*` already ends in one, so it is unaffected;
# `/b` is POSTed with no query string, so it stays exact.
#
# `/check*` also matches `/checkfoo`; the Worker routes on `path === '/check'`
# and everything else falls through to the beacon handler's 404/405, so the
# wider pattern costs nothing.
#
# The rung-0 rule must be WIDENED to cover the conversion endpoints as well as
# the beacon — rungs 1 and 2 execute inside the Worker, so a request they reject
# is already billed, and /convert costs more CPU than /b does. The expression is
# in README.md § Deploy runbook, step 6:
#
#   (http.host eq "toolshed.lemon-agent.dev" and
#    (http.request.uri.path eq "/b" or starts_with(http.request.uri.path, "/convert/")))
#
# GET /check is deliberately NOT in the rule: it touches no D1 and does no work,
# so it is left cheap and open.

routes = [
  { pattern = "toolshed.lemon-agent.dev/b", zone_name = "lemon-agent.dev" },
  { pattern = "toolshed.lemon-agent.dev/check*", zone_name = "lemon-agent.dev" },
  { pattern = "toolshed.lemon-agent.dev/convert/*", zone_name = "lemon-agent.dev" }
]

# Payment configuration. All three are UNSET by default, and unset is a working
# state — see README.md § Payment (x402).
#
# NOTHING HERE CHANGED FOR x402 v2 (2026-08-19), which is the question an
# operator asks first. The Worker serves v1 and v2 from the same 402 — v1 in the
# body, v2 base64 in a PAYMENT-REQUIRED response header — and both verify and
# settle against the same CDP facilitator, at the same two endpoints, with the
# same credentials. No new var, no new secret, no new endpoint, and no new
# production dependency in the bundle. See README § "x402 v2 — dual-stack".
#
# [vars]
# PAYTO = "0x..."            # receiving address for USDC on Base
# FACILITATOR_URL = "..."    # OPTIONAL override; defaults to the CDP facilitator
#                            # (https://api.cdp.coinbase.com/platform/v2/x402).
#                            # Only the test suite sets it, to reach a local mock.
# FREE_TIER_DAILY = "3"      # OPTIONAL. Free conversions per caller per UTC day.
#                            # UNSET = 0 = OFF, which is the production default
#                            # and the only Bazaar-discoverable configuration.
#
# ON FREE_TIER_DAILY, before you uncomment it. This var is the ONLY runtime
# authority for the free tier — the Worker no longer reads the number compiled
# into worker/catalog.generated.js — so setting it here (or in the dashboard)
# takes effect on the next request, and GET /check starts reporting it
# immediately without a rebuild.
#
# Turning it on has a cost that is not obvious: it makes this service fall OUT
# of Coinbase's Bazaar discovery index. The index requires that an
# unauthenticated request answer 402, and it health-probes on an interval — a
# free tier hands any fresh IP a 200, which fails that check and delists an
# endpoint that was already listed. That is why the tier was retired on
# 2026-08-19; the mechanism is kept, the default is not.
#
# And it is only half the switch. The STATIC surfaces — the page, catalog.json,
# llms.txt, llms-full.txt — are generated from FREE_TIER_DAILY in build.mjs, so
# re-enabling means: set this var, set that constant to the same N, run
# `npm run build`, and redeploy BOTH the Worker and the Pages site. Set one
# without the other and the site advertises a tier it does not honour, or
# honours one it does not advertise.
#
# The two CDP credentials are SECRETS, not vars — they never belong in this
# file, which is committed. Set them once per environment:
#
#   npx wrangler secret put CDP_API_KEY_ID
#   npx wrangler secret put CDP_API_KEY_SECRET
#
# Without both, over-tier paid calls are still SERVED (availability-first) but
# carry `x-payment-verified: false` and `x-payment-error:
# facilitator-unconfigured`, and every one is recorded in `settlements`. That is
# a working state, and it is also a revenue-is-zero state — see README
# § Settlement (live).
#
# `settlements` is a NEW TABLE. Run the migration in README § Migration — the
# settlements table before deploying a Worker that verifies payments.

# ------------------------------------------------------------------ alerts
#
# Owner-facing payment alerts: a Telegram ping and an email when money moves.
# They fire from inside ctx.waitUntil, AFTER the caller has its response, and
# each channel is independently try/caught — so a dead Telegram, a bad token or
# an unconfigured Email Routing zone costs a notification and NOTHING ELSE. A
# channel with no config is skipped before any network call, which means UNSET
# IS A WORKING STATE: the defaults below change no behaviour on their own.
# See README § Payment alerts.
#
# THREE SECRETS, none of which may ever appear in this committed file:
#
#   npx wrangler secret put TELEGRAM_BOT_TOKEN   # from @BotFather
#   npx wrangler secret put TELEGRAM_CHAT_ID     # README says how to find it
#   npx wrangler secret put ALERT_EMAIL_TO       # the owner's personal address
#
# ALERT_EMAIL_TO is a SECRET rather than a var for a reason that is about this
# repo rather than about cryptography: the toolshed is public, and a personal
# inbox address committed to it is a spam magnet forever. It must ALSO be a
# VERIFIED Email Routing destination on this zone — Cloudflare refuses to
# deliver to an address that has not clicked its confirmation link.
#
# TELEGRAM_API_BASE is an OPTIONAL var, defaulting to https://api.telegram.org.
# Only the test suite sets it, to reach a local mock — the same override pattern
# as FACILITATOR_URL above. It is deliberately not set here.

[vars]
# The house's own wallets, so the owner's $0.001 test buys read as "🧪 test
# settlement" rather than as a sale. Any payer NOT listed here gets the loud
# "🍋💰 THIRD PARTY PAID" message — the event this whole channel exists for,
# which must never look like a drill.
#
# NON-SECRET on purpose: these are public chain addresses, already visible on
# Base to anyone running the ledger queries in README § Reading the ledger.
# Comma-separated; compared lowercased, so the case written here does not
# matter.
#
# This is the throwaway buyer from `npm run buyer:create` (README § The buyer
# test kit) — the key behind the live settlements this rail has already proven.
HOUSE_PAYERS = "0x632ff2f904cc6ab6d741a42014c4c483f328e92f"

# The email channel's binding. UNRESTRICTED — deliberately no
# `destination_address` field, because that would put the owner's personal inbox
# in a public repo. The recipient comes from the ALERT_EMAIL_TO secret instead,
# and Cloudflare still enforces the constraint that actually matters: it only
# delivers to a VERIFIED Email Routing destination on this zone.
#
# The Worker reads this binding defensively (`env.ALERT_EMAIL?.send`), so a
# deployment on an account without Email Routing has no email channel rather
# than a broken one.
[[send_email]]
name = "ALERT_EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "lemon_toolshed"
# Placeholder — local dev only. REPLACE at deploy with the id printed by
# `wrangler d1 create lemon_toolshed`.
database_id = "50c4127d-9f06-47e3-a727-2ebbc0036505"
